name: CI

# Pushes to main and releases run this through publish.yml, which only publishes the
# image once every job here has passed.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to check (default the triggering commit)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install
        run: cd backend && uv sync --all-extras
      - name: Lint
        run: cd backend && uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: cd backend && uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: creeparr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The tools are copied in from other images; check they run.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh creeparr:ci -c '
            set -e
            ffmpeg -hide_banner -version | head -1
            ffprobe -hide_banner -version | head -1
            deno --version | head -1
            python -c "from yt_dlp.postprocessor.ffmpeg import FFmpegPostProcessor as F; assert F().available"
          '
