name: Update yt-dlp and gallery-dl

# Sites break yt-dlp and gallery-dl often, and fixes ship in new releases. This
# upgrades both in uv.lock every week, runs the tests, bumps the patch version (every
# push to main is a new version) and pushes to main, then starts the publish workflow.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start publish.yml (pushes made with GITHUB_TOKEN don't trigger it)

concurrency:
  group: update-downloaders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7

      - name: Upgrade yt-dlp and gallery-dl
        working-directory: backend
        run: uv lock --upgrade-package yt-dlp --upgrade-package gallery-dl

      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp and gallery-dl are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- backend/uv.lock | grep -E '^[-+]version' || true
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        working-directory: backend
        run: |
          uv sync --all-extras
          uv run ruff check .
          uv run pytest -q

      - name: Bump version, commit and push
        if: steps.diff.outputs.changed == 'true'
        id: push
        run: |
          versions=$(cd backend && uv run --no-sync python - <<'EOF'
          import importlib.metadata as m
          print(", ".join(f"{p} {m.version(p)}" for p in ("yt-dlp", "gallery-dl")))
          EOF
          )
          new=$(python3 - <<'EOF'
          import re
          from pathlib import Path
          p = Path("backend/creeparr/__init__.py")
          s = p.read_text()
          major, minor, patch = re.search(r'__version__ = "(\d+)\.(\d+)\.(\d+)"', s).groups()
          new = f"{major}.{minor}.{int(patch) + 1}"
          p.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{new}"', s))
          print(new)
          EOF
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock backend/creeparr/__init__.py
          git commit -m "Update ${versions}; bump to ${new}"
          git push origin HEAD:main
          echo "version=${new}" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
