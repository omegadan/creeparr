name: Update yt-dlp and gallery-dl

# Sites break yt-dlp and gallery-dl often, and fixes ship in new releases. This
# upgrades both in uv.lock every week, runs the tests, notes it in CHANGELOG.md and
# pushes to main. If that update is the only change since the last release, it starts a
# patch release (release.yml), so site fixes reach `latest` within a week. Otherwise
# there's unreleased work nobody has released yet: it only publishes `edge`, and the
# update goes out with the next release.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start release.yml or publish.yml (pushes made with GITHUB_TOKEN don't)

concurrency:
  group: update-downloaders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0 # the tags, to find the last release
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Upgrade yt-dlp and gallery-dl
        working-directory: backend
        run: uv lock --upgrade-package yt-dlp --upgrade-package gallery-dl

      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp and gallery-dl are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- backend/uv.lock | grep -E '^[-+]version' || true
          fi

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        working-directory: backend
        run: |
          uv sync --all-extras
          uv run ruff check .
          uv run pytest -q

      - name: Note, commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          versions=$(cd backend && uv run --no-sync python - <<'EOF'
          import importlib.metadata as m
          print(", ".join(f"{p} {m.version(p)}" for p in ("yt-dlp", "gallery-dl")))
          EOF
          )
          python3 .github/scripts/release.py note "Update ${versions}."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock CHANGELOG.md
          git commit -m "Update ${versions}"
          git push origin HEAD:main

      - name: Release, or publish edge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          others=""
          if [ -n "$last" ]; then
            # Anything since the last release besides this job's own updates?
            others=$(git log --format='%an|%s' "$last"..HEAD \
              | grep -v '^github-actions\[bot\]|Update yt-dlp' || true)
          fi
          if [ -n "$last" ] && [ -z "$others" ]; then
            gh workflow run release.yml -f bump=patch
            echo "Only downloader updates since $last: started a patch release." >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run publish.yml --ref main
            {
              echo "Published as \`edge\` only: there are unreleased changes since ${last:-the first commit}."
              echo "This update goes out with the next release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
