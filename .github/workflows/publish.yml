name: Publish image

# Where the image goes:
#   a push to main          -> `edge` (and `sha-<commit>`)
#   a release (vX.Y.Z)      -> `X.Y.Z`, `X.Y`, `latest` (and `sha-<commit>`)
# Releases are made by release.yml, which calls this with the version. Pushing a v* tag
# by hand publishes it too, but makes no GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z), published from tag vX.Y.Z; empty publishes edge
        type: string
        default: ""

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$version" ]; then ref="v$version"; else ref="$GITHUB_SHA"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version:-edge} from $ref" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: target
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.ref }}

  publish:
    needs: [target, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.target.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.ref }}
      - id: commit
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            actual=$(python3 .github/scripts/release.py version)
            if [ "$actual" != "$VERSION" ]; then
              echo "tag v$VERSION but backend/creeparr/__init__.py says $actual" >&2
              exit 1
            fi
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ needs.target.outputs.version == '' }}
            type=semver,pattern={{version}},value=${{ needs.target.outputs.version }},enable=${{ needs.target.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.target.outputs.version }},enable=${{ needs.target.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.target.outputs.version != '' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
