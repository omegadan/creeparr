name: Publish image

# Where the image goes:
#   a push to main          -> `edge` (and `sha-<commit>`)
#   a release (vX.Y.Z)      -> `X.Y.Z`, `X.Y`, `latest` (and `sha-<commit>`)
# Releases are made by release.yml, which calls this with the version. Pushing a v* tag
# by hand publishes it too, but makes no GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z), published from tag vX.Y.Z; empty publishes edge
        type: string
        default: ""

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$version" ]; then ref="v$version"; else ref="$GITHUB_SHA"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version:-edge} from $ref" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: target
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.ref }}

  publish:
    needs: [target, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # to sign the provenance attestation (Sigstore, keyless)
      attestations: write
    env:
      VERSION: ${{ needs.target.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - id: commit
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            actual=$(python3 .github/scripts/release.py version)
            if [ "$actual" != "$VERSION" ]; then
              echo "tag v$VERSION but backend/creeparr/__init__.py says $actual" >&2
              exit 1
            fi
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ needs.target.outputs.version == '' }}
            type=semver,pattern={{version}},value=${{ needs.target.outputs.version }},enable=${{ needs.target.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.target.outputs.version }},enable=${{ needs.target.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.target.outputs.version != '' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit's own attestations, stored with the image: how it was built, and
          # an SBOM of what's in it (`docker buildx imagetools inspect --format`).
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A signed statement that this exact image digest was built by this workflow from
      # this commit. Check it with: gh attestation verify oci://<image> --owner omegadan
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
