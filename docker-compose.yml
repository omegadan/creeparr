services:
  creeparr:
    image: ghcr.io/omegadan/creeparr:latest
    # build: .   # uncomment to build from source instead
    container_name: creeparr
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-America/Los_Angeles}
      - CREEPARR_LOG_LEVEL=${CREEPARR_LOG_LEVEL:-INFO}
      - CREEPARR_ONLYFANS_DOWNLOAD_DIR=/downloads-onlyfans
      - CREEPARR_YOUTUBE_DOWNLOAD_DIR=/downloads-youtube
      - CREEPARR_INSTAGRAM_DOWNLOAD_DIR=/downloads-instagram
      - CREEPARR_REDDIT_DOWNLOAD_DIR=/downloads-reddit
    volumes:
      - ${CONFIG_DIR}:/config
      - ${DOWNLOAD_DIR}:/downloads
      - ${ONLYFANS_DOWNLOAD_DIR}:/downloads-onlyfans
      - ${YOUTUBE_DOWNLOAD_DIR}:/downloads-youtube
      - ${INSTAGRAM_DOWNLOAD_DIR}:/downloads-instagram
      - ${REDDIT_DOWNLOAD_DIR}:/downloads-reddit
    ports:
      - "${PORT:-7979}:7979"
    restart: unless-stopped
