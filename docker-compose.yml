services:
  patrearr:
    image: ghcr.io/omegadan/patrearr:latest
    # build: .   # uncomment to build from source instead
    container_name: patrearr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - PATREARR_LOG_LEVEL=${PATREARR_LOG_LEVEL:-INFO}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "${PORT:-7979}:7979"
    restart: unless-stopped
