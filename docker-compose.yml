services:
  patrearr:
    image: ghcr.io/omegadan/patrearr:latest
    # build: .   # uncomment to build from source instead
    container_name: patrearr
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - TZ=${TZ:-America/Los_Angeles}
      - PATREARR_LOG_LEVEL=${PATREARR_LOG_LEVEL:-INFO}
      - PATREARR_ONLYFANS_DOWNLOAD_DIR=/downloads-onlyfans
      - PATREARR_YOUTUBE_DOWNLOAD_DIR=/downloads-youtube
      - PATREARR_INSTAGRAM_DOWNLOAD_DIR=/downloads-instagram
      - PATREARR_REDDIT_DOWNLOAD_DIR=/downloads-reddit
    volumes:
      - ${CONFIG_DIR}:/config
      - ${DOWNLOAD_DIR}:/downloads
      - ${ONLYFANS_DOWNLOAD_DIR}:/downloads-onlyfans
      - ${YOUTUBE_DOWNLOAD_DIR}:/downloads-youtube
      - ${INSTAGRAM_DOWNLOAD_DIR}:/downloads-instagram
      - ${REDDIT_DOWNLOAD_DIR}:/downloads-reddit
    ports:
      - "${PORT:-7979}:7979"
    restart: unless-stopped
