[project]
name = "creeparr"
dynamic = ["version"]  # read from creeparr/__init__.py
description = "Self-hosted, arr-style archiver for Patreon creators you support"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx[http2]>=0.27",
    "yt-dlp>=2025.1.1",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "markdownify>=0.13",
    "python-multipart>=0.0.9",
    "gallery-dl>=1.32.13",
]

[project.optional-dependencies]
impersonate = ["curl_cffi>=0.7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
creeparr = "creeparr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "creeparr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["creeparr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# Pin import classification so grouping is deterministic across environments.
# alembic is only present when dependencies are installed (CI), so without this
# it is treated as third-party in CI but first-party locally, and the two
# disagree on the blank line in migration files.
known-first-party = ["creeparr"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
